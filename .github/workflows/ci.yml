name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    env:
      # No Supabase variables here, deliberately. Both clients are now built
      # lazily on the first request (src/lib/supabase/server.ts), so a correct
      # build needs no configuration at all. Leaving them out turns this job
      # into the regression test for that: move createClient() back to module
      # scope and CI fails here, rather than someone's first Vercel deploy
      # failing with supabase-js's opaque "supabaseUrl is required".
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Lints before the build so a style failure reports in seconds rather
      # than after a full compile.
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Runs after the build so Next's generated types (next-env.d.ts and
      # .next/types) exist. This also covers scripts/simulate.ts, which is not
      # part of the Next build graph and would otherwise never be type-checked.
      - name: Type-check
        run: npx tsc --noEmit

      # The fairness audit is seeded, so it is a genuine regression test rather
      # than a coin flip: it fails only if the algorithm actually got worse at
      # equal playing time, avoiding repeat teammates, or mixing clubs.
      - name: Fairness audit
        run: npm run simulate
